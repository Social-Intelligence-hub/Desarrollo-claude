name: SIH v3 — Manual Single-Entity Scrape

# Permite re-analizar una empresa específica desde la UI de Actions.
on:
  workflow_dispatch:
    inputs:
      entity_slug:
        description: "Slug de la entidad a procesar (ej: swisher-dominicana, capex)"
        required: true
        type: string
      conglomerate:
        description: "Slug del conglomerado"
        required: false
        default: "zona-franca"
        type: string
      first_run:
        description: "Modo histórico completo (en vez de incremental)"
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: social-intelligence-hub/scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: social-intelligence-hub/scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run targeted scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          MODE_FLAG="--incremental"
          if [ "${{ inputs.first_run }}" = "true" ]; then
            MODE_FLAG="--first-run"
          fi
          python main.py $MODE_FLAG --all-collectors \
            --conglomerate "${{ inputs.conglomerate }}" \
            --entity-filter "${{ inputs.entity_slug }}"

      - name: Upload scraper.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-scrape-${{ inputs.entity_slug }}-${{ github.run_id }}
          path: social-intelligence-hub/scraper/scraper.log
          retention-days: 14
