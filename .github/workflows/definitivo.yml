name: "!!! SCRAPER DEFINITIVO !!!"

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

jobs:
  scrape:
    name: Recolectar menciones
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: social-intelligence-hub/scraper/requirements.txt

      - name: Install Python dependencies
        working-directory: ./social-intelligence-hub/scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & Deps
        working-directory: ./social-intelligence-hub/scraper
        run: |
          python -m playwright install --with-deps chromium

      - name: Run social listening scraper
        working-directory: ./social-intelligence-hub/scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_LANGUAGE_ENDPOINT: ${{ secrets.AZURE_LANGUAGE_ENDPOINT }}
          AZURE_LANGUAGE_KEY: ${{ secrets.AZURE_LANGUAGE_KEY }}
        run: |
          python main.py
          python run_cleanup.py

      - name: Upload scraper logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-logs-${{ github.run_number }}
          path: "**/scraper.log"
          retention-days: 7
