name: Social Listening Scraper

on:
  schedule:
    - cron: '0 */12 * * *' # Ejecutar cada 12 horas (medianoche y mediodía)
  workflow_dispatch: # Permite disparar el scraper manualmente desde la pestaña Actions

env:
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd scraper
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2 libasound2t64 libasound2-data || sudo apt-get install -y libasound2t64 libasound2-data
          python -m playwright install-deps

      - name: Install Playwright Chromium
        run: |
          cd scraper
          python -m playwright install chromium

      - name: Run Scraper & Cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Azure AI Language (Opcional, si no está configurado el scraper usará modo neutral)
          AZURE_LANGUAGE_ENDPOINT: ${{ secrets.AZURE_LANGUAGE_ENDPOINT }}
          AZURE_LANGUAGE_KEY: ${{ secrets.AZURE_LANGUAGE_KEY }}
        run: |
          cd scraper
          echo "Iniciando recolección de menciones..."
          python main.py
          echo "Iniciando limpieza de datos e identificación de demo..."
          python run_cleanup.py
          echo "Proceso completado satisfactoriamente."

      - name: Upload scraper logs
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: scraper-logs-${{ github.run_number }}
          path: "**/scraper.log"
          retention-days: 7
