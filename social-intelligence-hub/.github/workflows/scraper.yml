name: Social Listening Scraper

on:
  schedule:
    # Ejecutar cada 12 horas (06:00 y 18:00 UTC)
    - cron: "0 6,18 * * *"
  workflow_dispatch:    # Permite ejecución manual desde GitHub UI
    inputs:
      dry_run:
        description: "Dry run (no guarda en BD)"
        required: false
        default: "false"
        type: boolean

jobs:
  scrape:
    name: Recolectar menciones
    runs-on: ubuntu-22.04  # Forzamos 22.04 para evitar problemas con libasound2 de Ubuntu 24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        working-directory: ./scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & Deps
        working-directory: ./scraper
        run: |
          python -m playwright install --with-deps chromium

      - name: Run social listening scraper
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_LANGUAGE_ENDPOINT: ${{ secrets.AZURE_LANGUAGE_ENDPOINT }}
          AZURE_LANGUAGE_KEY: ${{ secrets.AZURE_LANGUAGE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN MODE ==="
            python main.py --dry-run
          else
            echo "=== RUNNING SCRAPER ==="
            python main.py
            echo "=== RUNNING CLEANUP ==="
            python run_cleanup.py
          fi

      - name: Upload scraper logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-logs-${{ github.run_number }}
          path: "**/scraper.log"
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::El scraper falló. Revisar los logs para más detalles."
